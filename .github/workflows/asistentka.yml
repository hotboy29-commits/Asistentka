name: Asistentka

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "*/5 6-8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asistentka
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spustit asistentku
        env:
          ASIST_PASS: ${{ secrets.ASIST_PASS }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASS: ${{ secrets.ICLOUD_APP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIP_SENDERS: ${{ secrets.VIP_SENDERS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python asistentka.py

      - name: Uložit zašifrovaná data
        run: |
          git config user.name "asistentka-bot"
          git config user.email "asistentka-bot@users.noreply.github.com"
          git add data.enc.json
          if git diff --cached --quiet; then
            echo "Beze změn."
            exit 0
          fi
          git commit -m "Aktualizace dat $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Uloženo."
              exit 0
            fi
            echo "Pokus $i selhal, zkusím to znovu."
            sleep 5
          done
          echo "Data se nepodařilo uložit."
          exit 1
